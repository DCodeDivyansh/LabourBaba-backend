name: Production CI & Security Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

jobs:
  static-analysis:
    name: 1. Static Analysis & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies (Deterministic Lockfile)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Execute Security & Secret Leakage Audit
        run: npm run security:scan

  database-and-test-gates:
    name: 2. Database Migrations & Comprehensive Test Gates
    runs-on: ubuntu-latest
    needs: static-analysis
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: labourbaba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/labourbaba_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_TLS: false
      JWT_ACCESS_SECRET: e2e_test_access_secret_32_characters_minimum_ok!
      JWT_REFRESH_SECRET: e2e_test_refresh_secret_32_characters_minimum_ok!
      SMS_PROVIDER: mock

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma Production Migrations
        run: npx prisma migrate deploy

      - name: Verify Migration Consistency Status
        run: npx prisma migrate status

      - name: Run Authorization Matrix Suite (Issue 51)
        run: npm run test:auth

      - name: Run Real PostgreSQL Concurrency & State Machine Suite (Issues 52 & 53)
        run: npm run test:concurrency

      - name: Run Dependency Resilience & Fault Tolerance Suite (Issue 54)
        run: npm run test:resilience

      - name: Run Staging End-to-End Smoke Test Suite (Issue 57)
        run: npm run test:smoke

      - name: Run Full Test Suite
        run: npm run test:all

  build-and-artifact-gate:
    name: 3. Production Build & Docker Artifact Verification
    runs-on: ubuntu-latest
    needs: [static-analysis, database-and-test-gates]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile Production TypeScript Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Verify Hardened Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: labourbaba-backend:test
